services:
  - type: web
    name: vibestream-api
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: vibestream-db
          property: connectionString
      - key: AGORA_APP_ID
        sync: false
      - key: AGORA_APP_CERTIFICATE
        sync: false

databases:
  - name: vibestream-db
    databaseName: vibestream
    user: vibestream
    region: oregon
